<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | AIC Ziwani</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#c8102e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(178, 34, 34, 0.12), transparent 40%),
        linear-gradient(180deg, #fff8f6 0%, #ffffff 100%);
    }

    .reset-card {
      width: min(100%, 440px);
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(178, 34, 34, 0.12);
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 20px 60px rgba(32, 20, 20, 0.12);
    }

    .reset-card h1 {
      margin: 0 0 12px;
      font-size: 30px;
      color: var(--text-primary);
      text-align: center;
    }

    .reset-copy {
      margin: 0 0 22px;
      text-align: center;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .reset-form {
      display: grid;
      gap: 14px;
    }

    .reset-form input,
    .reset-form button {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      font: inherit;
      box-sizing: border-box;
    }

    .reset-form input {
      border: 1px solid var(--border-color, #ddd);
      background: #fff;
      color: var(--text-primary);
    }

    .reset-form button {
      border: none;
      background: var(--primary-red, #b22222);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .reset-message {
      display: none;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .reset-message.error {
      background: rgba(178, 34, 34, 0.12);
      color: #8f1717;
    }

    .reset-message.success {
      background: rgba(11, 122, 66, 0.12);
      color: #0b7a42;
    }

    .password-field-wrap {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }

    .password-field-wrap input {
      width: 100%;
      padding-right: 44px !important;
    }

    .password-toggle-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent !important;
      border: none !important;
      color: var(--text-secondary, #666) !important;
      cursor: pointer;
      padding: 6px !important;
      display: flex !important;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      width: 32px !important;
      height: 32px !important;
      box-shadow: none !important;
      line-height: 1 !important;
      transition: color 0.2s ease, transform 0.15s ease;
      z-index: 2;
    }

    .password-toggle-btn:hover {
      color: var(--primary-red, #b22222) !important;
      transform: translateY(-50%) scale(1.05);
    }

    .password-toggle-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .password-checker {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: -6px;
      margin-bottom: 2px;
    }

    .strength-meter {
      height: 4px;
      width: 100%;
      background: rgba(0, 0, 0, 0.08);
      border-radius: 999px;
      overflow: hidden;
    }

    [data-theme="dark"] .strength-meter {
      background: rgba(255, 255, 255, 0.12);
    }

    .strength-meter-bar {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      transition: width 0.28s ease, background-color 0.28s ease;
    }

    .strength-meter-bar.weak { width: 25%; background-color: #ef4444; }
    .strength-meter-bar.fair { width: 50%; background-color: #f59e0b; }
    .strength-meter-bar.good { width: 75%; background-color: #3b82f6; }
    .strength-meter-bar.strong { width: 100%; background-color: #10b981; }

    .strength-caption {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-secondary, #666);
      display: flex;
      justify-content: space-between;
    }

    .password-match-row {
      font-size: 11.5px;
      font-weight: 500;
      margin-top: -6px;
      margin-bottom: 2px;
    }

    .password-match-row.match { color: #10b981; }
    .password-match-row.mismatch { color: #ef4444; }

    .back-link {
      display: inline-block;
      margin-top: 18px;
      color: var(--primary-red, #b22222);
      text-decoration: none;
      font-weight: 600;
    }

    .login-redirect-btn {
      display: inline-block;
      width: 100%;
      text-align: center;
      padding: 14px 16px;
      margin-top: 14px;
      background: var(--primary-red, #b22222);
      color: #fff;
      font-weight: 700;
      border-radius: 12px;
      text-decoration: none;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <main class="reset-card">
    <h1>Choose A New Password</h1>
    <p class="reset-copy">
      Set a new password for your account. Your reset link is valid for 1 hour.
    </p>

    <div id="resetError" class="reset-message error"></div>
    <div id="resetSuccess" class="reset-message success"></div>

    <form id="resetForm" class="reset-form">
      <div>
        <div class="password-field-wrap">
          <input type="password" id="newPassword" name="password" placeholder="New password" minlength="8" required autocomplete="new-password">
          <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('newPassword', this)" aria-label="Toggle password visibility" title="Show password">
            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg class="eye-closed" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </button>
        </div>
        <div id="resetPasswordChecker" class="password-checker" style="display:none;">
          <div class="strength-meter">
            <div id="resetStrengthMeterBar" class="strength-meter-bar"></div>
          </div>
          <div class="strength-caption">
            <span id="resetStrengthLabel">Password strength</span>
            <span id="resetStrengthHint">Min 8 characters</span>
          </div>
        </div>
      </div>
      <div>
        <div class="password-field-wrap">
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm new password" minlength="8" required autocomplete="new-password">
          <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('confirmPassword', this)" aria-label="Toggle password visibility" title="Show password">
            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg class="eye-closed" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </button>
        </div>
        <div id="resetPasswordMatch" class="password-match-row" style="display:none;"></div>
      </div>
      <button type="submit" id="resetSubmitBtn">Reset Password</button>
    </form>

    <div id="postResetAction" style="display:none;">
      <a class="login-redirect-btn" href="/index.html">Proceed to Login</a>
    </div>

    <a id="backHomeLink" class="back-link" href="/index.html">Back to home</a>
  </main>

  <script src="runtime-config.js"></script>
  <script src="backend-origin.js"></script>
  <script>
    const LOCAL_BACKEND_ORIGIN = "http://localhost:3000";
    const resetForm = document.getElementById("resetForm");
    const resetError = document.getElementById("resetError");
    const resetSuccess = document.getElementById("resetSuccess");
    const resetSubmitBtn = document.getElementById("resetSubmitBtn");

    const savedTheme = localStorage.getItem("theme") || "light";
    document.documentElement.setAttribute("data-theme", savedTheme);

    function getBackendOrigin() {
      if (window.CYABackendOrigin?.resolveBackendOrigin) {
        return window.CYABackendOrigin.resolveBackendOrigin({ localFallback: LOCAL_BACKEND_ORIGIN });
      }

      const { protocol, hostname, port, origin } = window.location;
      const isLocalHost = hostname === "localhost" || hostname === "127.0.0.1";
      if (protocol.startsWith("http") && (!isLocalHost || port === "3000")) {
        return origin;
      }

      return LOCAL_BACKEND_ORIGIN;
    }

    function buildBackendUrl(path) {
      const resolvedBackendOrigin = getBackendOrigin();

      if (window.CYABackendOrigin?.buildBackendUrl) {
        return window.CYABackendOrigin.buildBackendUrl(path, resolvedBackendOrigin);
      }

      return new URL(path, resolvedBackendOrigin).toString();
    }

    function setMessage(element, message) {
      resetError.style.display = "none";
      resetSuccess.style.display = "none";

      if (!message) {
        return;
      }

      element.textContent = message;
      element.style.display = "block";
    }

    async function validateToken(token) {
      try {
        const validateUrl = new URL(buildBackendUrl("/api/auth/reset-password/validate"));
        validateUrl.searchParams.set("token", token);

        const response = await fetch(validateUrl.toString(), { credentials: "include" });
        const result = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(result.error || "This password reset link is invalid or has expired.");
        }
      } catch (error) {
        setMessage(resetError, error.message || "This password reset link is invalid or has expired.");
        resetForm.querySelectorAll("input, button").forEach((element) => {
          element.disabled = true;
        });
      }
    }

    const token = new URLSearchParams(window.location.search).get("token") || "";

    if (!token) {
      setMessage(resetError, "This password reset link is missing or invalid.");
      resetForm.querySelectorAll("input, button").forEach((element) => {
        element.disabled = true;
      });
    } else {
      validateToken(token);
    }

    function togglePasswordVisibility(inputId, btnEl) {
      const input = document.getElementById(inputId);
      if (!input) return;
      const isPassword = input.type === "password";
      input.type = isPassword ? "text" : "password";

      const eyeOpen = btnEl.querySelector(".eye-open");
      const eyeClosed = btnEl.querySelector(".eye-closed");
      if (eyeOpen && eyeClosed) {
        eyeOpen.style.display = isPassword ? "none" : "block";
        eyeClosed.style.display = isPassword ? "block" : "none";
      }
      btnEl.setAttribute("aria-label", isPassword ? "Hide password" : "Show password");
      btnEl.setAttribute("title", isPassword ? "Hide password" : "Show password");
    }

    const newPasswordInput = document.getElementById("newPassword");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const resetPasswordChecker = document.getElementById("resetPasswordChecker");
    const resetStrengthMeterBar = document.getElementById("resetStrengthMeterBar");
    const resetStrengthLabel = document.getElementById("resetStrengthLabel");
    const resetStrengthHint = document.getElementById("resetStrengthHint");
    const resetPasswordMatch = document.getElementById("resetPasswordMatch");

    function updateResetStrength() {
      const val = newPasswordInput.value;
      if (!val) {
        resetPasswordChecker.style.display = "none";
        return;
      }
      resetPasswordChecker.style.display = "flex";
      const hasMinLength = val.length >= 8;
      const hasLetters = /[a-zA-Z]/.test(val);
      const hasNumbersOrSymbols = /[0-9!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?~`]/.test(val);

      let score = 1;
      if (hasMinLength) score = 2;
      if (hasMinLength && hasLetters && hasNumbersOrSymbols) score = 3;
      if (hasMinLength && val.length >= 10 && hasLetters && hasNumbersOrSymbols) score = 4;

      resetStrengthMeterBar.className = "strength-meter-bar";
      if (score === 1) {
        resetStrengthMeterBar.classList.add("weak");
        resetStrengthLabel.textContent = "Too short (min 8 chars)";
        resetStrengthHint.textContent = "Weak";
      } else if (score === 2) {
        resetStrengthMeterBar.classList.add("fair");
        resetStrengthLabel.textContent = "Add numbers or symbols";
        resetStrengthHint.textContent = "Fair";
      } else if (score === 3) {
        resetStrengthMeterBar.classList.add("good");
        resetStrengthLabel.textContent = "Good password";
        resetStrengthHint.textContent = "Good";
      } else {
        resetStrengthMeterBar.classList.add("strong");
        resetStrengthLabel.textContent = "Strong password";
        resetStrengthHint.textContent = "Strong";
      }
    }

    function updateResetMatch() {
      const pass = newPasswordInput.value;
      const conf = confirmPasswordInput.value;

      if (!conf) {
        resetPasswordMatch.style.display = "none";
        return;
      }

      resetPasswordMatch.style.display = "block";
      if (pass === conf) {
        resetPasswordMatch.className = "password-match-row match";
        resetPasswordMatch.textContent = "✓ Passwords match";
      } else {
        resetPasswordMatch.className = "password-match-row mismatch";
        resetPasswordMatch.textContent = "✕ Passwords do not match";
      }
    }

    if (newPasswordInput) {
      newPasswordInput.addEventListener("input", () => {
        updateResetStrength();
        updateResetMatch();
      });
    }

    if (confirmPasswordInput) {
      confirmPasswordInput.addEventListener("input", updateResetMatch);
    }

    resetForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      setMessage(null, "");

      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (newPassword.length < 8) {
        setMessage(resetError, "Password must be at least 8 characters long.");
        return;
      }

      if (newPassword !== confirmPassword) {
        setMessage(resetError, "Passwords do not match.");
        return;
      }

      resetSubmitBtn.disabled = true;
      resetSubmitBtn.textContent = "Saving...";

      try {
        const response = await fetch(buildBackendUrl("/api/auth/reset-password"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ token, password: newPassword }),
        });

        const result = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(result.error || "Could not reset password right now.");
        }

        resetForm.style.display = "none";
        setMessage(resetSuccess, result.message || "Your password has been reset successfully.");
        const postResetAction = document.getElementById("postResetAction");
        if (postResetAction) postResetAction.style.display = "block";
        const backHomeLink = document.getElementById("backHomeLink");
        if (backHomeLink) backHomeLink.style.display = "none";
      } catch (error) {
        setMessage(resetError, error.message || "Could not reset password right now.");
      } finally {
        resetSubmitBtn.disabled = false;
        resetSubmitBtn.textContent = "Reset Password";
      }
    });
  </script>
  <script src="/pwa.js" defer></script>
</body>
</html>
