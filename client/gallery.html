<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery | AIC Ziwani</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#c8102e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/favicon.png">

<script src="runtime-config.js"></script>
<script src="backend-origin.js"></script>
<script>
  (function() {
    const { protocol, hostname, port, pathname, search, hash } = window.location;
    const isLocalHost = hostname === "localhost" || hostname === "127.0.0.1";

    if (protocol.startsWith("http") && isLocalHost && port && port !== "3000") {
      window.location.replace(`${protocol}//${hostname}:3000${pathname}${search}${hash}`);
    }
  })();
</script>

<script>
  (function() {
    const theme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<style>
:root {
  --primary-red: #c8102e;
  --dark-red: #9e0d23;
  --bg-primary: #f4f4f4;
  --bg-secondary: white;
  --bg-secondary-translucent: rgba(255, 255, 255, 0.96);
  --text-primary: #222;
  --text-secondary: gray;
  --text-on-primary: white;
  --border-color: #ddd;
  --shadow-color-light: rgba(0,0,0,0.05);
  --shadow-color-heavy: rgba(0,0,0,0.08);
  --shadow-color-hover: rgba(0,0,0,0.12);
  --button-bg: #f0f0f0;
  --button-border: #ddd;
  --button-hover-bg: #e0e0e0;
}


[data-theme="dark"] {
  --primary-red: #e53935;
  --dark-red: #c8102e;
  --bg-primary: #121212;
  --bg-secondary: #1e1e1e;
  --bg-secondary-translucent: rgba(30, 30, 30, 0.96);
  --text-primary: #e0e0e0;
  --text-secondary: #a0a0a0;
  --border-color: #333;
  --shadow-color-light: rgba(255,255,255,0.05);
  --shadow-color-heavy: rgba(0,0,0,0.2);
  --shadow-color-hover: rgba(0,0,0,0.3);
  --button-bg: #2a2a2a;
  --button-border: #444;
  --button-hover-bg: #3a3a3a;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: var(--bg-primary);
  color: var(--text-primary);
}

/* NAVBAR */
nav {
  background: var(--bg-secondary-translucent);
  padding: 16px 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 24px;
  flex-wrap: wrap;
  box-shadow: 0 4px 20px var(--shadow-color-light);
  position: sticky;
  top: 0;
  z-index: 1000;
}

.logo-area {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
}

.logo-area img {
  width: 56px;
}

.church-name h1 {
  font-size: 20px;
  font-weight: 700;
  color: var(--text-primary);
}

.church-name span {
  font-size: 12px;
  color: var(--text-primary);
  letter-spacing: 0.08em;
  display: block;
}

.nav-links {
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: flex-end;
  flex-wrap: wrap;
  margin-left: auto;
}

.nav-links a {
  text-decoration: none;
  padding: 10px 18px;
  border-radius: 999px;
  font-weight: 600;
  line-height: 1;
  transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
  color: var(--text-primary);
}

.nav-links a:hover {
  background: var(--primary-red);
  color: var(--text-on-primary);
  transform: translateY(-2px);
  box-shadow: 0 10px 24px rgba(200,16,46,0.18);
}

.nav-links a.active {
  background: var(--primary-red);
  color: var(--text-on-primary);
  box-shadow: 0 10px 24px rgba(200,16,46,0.18);
}

@media (max-width: 900px) {
  nav {
    padding: 14px 20px;
  }

  .church-name h1 {
    font-size: 18px;
  }

  .nav-links {
    width: 100%;
    justify-content: center;
  }
}

/* HEADER */
.page-header {
  background:
    linear-gradient(180deg, rgba(200,16,46,0.06), rgba(200,16,46,0)),
    var(--bg-secondary);
  color: var(--text-primary);
  padding: 72px 20px 56px;
  text-align: center;
  border-bottom: 1px solid var(--border-color);
  position: relative;
}

.page-header::before {
  content: "";
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: min(180px, 42vw);
  height: 4px;
  border-radius: 999px;
  background: linear-gradient(90deg, #c8102e, #9e0d23);
}

.page-header h2 {
  font-size: 42px;
  color: var(--primary-red);
}

.page-header p {
  margin-top: 15px;
  font-size: 18px;
  color: var(--text-secondary);
}

/* GALLERY SECTION */
.gallery-section {
  padding: 100px 60px;
}

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 25px;
}

.gallery-item {
  position: relative;
  overflow: hidden;
  border-radius: 18px;
  box-shadow: 0 12px 30px var(--shadow-color-heavy);
  cursor: pointer;
  transition: 0.3s ease;
}

.gallery-item img {
  width: 100%;
  height: 280px;
  object-fit: cover;
  transition: 0.4s ease;
}

.gallery-item:hover img {
  transform: scale(1.1);
}

.gallery-title {
  position: absolute;
  bottom: 0;
  background: rgba(0,0,0,0.6);
  color: white;
  width: 100%;
  padding: 10px;
  font-size: 14px;
  text-align: center;
}

/* MODAL STYLES */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 2000;
  padding: 20px;
}

.modal-overlay.open {
  display: flex;
}

.modal-content {
  background: var(--bg-secondary);
  border-radius: 18px;
  max-width: 900px;
  width: 100%;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  position: relative;
}

.modal-close {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 42px;
  height: 42px;
  border: 1px solid var(--button-border);
  border-radius: 999px;
  background: var(--bg-secondary);
  color: var(--text-primary);
  font-size: 26px;
  line-height: 1;
  cursor: pointer;
  z-index: 60;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 18px var(--shadow-color-light);
  transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
}

.modal-close:hover {
  background: var(--button-hover-bg);
  transform: translateY(-1px);
  box-shadow: 0 14px 28px var(--shadow-color-heavy);
}

#modalBody {
  padding: 58px 28px 28px;
  overflow-y: auto;
}

#modalBody .media-container {
  text-align: center;
  margin-bottom: 20px;
}

#modalBody video {
  max-width: 100%;
  max-height: 60vh;
  border-radius: 12px;
}

/* ================= INTERACTIVE PHOTO BOX (MODAL) ================= */
.interactive-photo-box {
  position: relative;
  width: 100%;
  border-radius: 14px;
  overflow: hidden;
  background: #09080d;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.22);
  user-select: none;
  touch-action: none;
}

.photo-stage {
  width: 100%;
  height: 56vh;
  min-height: 280px;
  max-height: 560px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
  cursor: zoom-in;
}

.photo-stage.is-zoomed {
  cursor: grab;
}

.photo-stage.is-grabbing {
  cursor: grabbing;
}

.photo-stage img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  transform-origin: center center;
  transition: transform 0.18s cubic-bezier(0.2, 0, 0.2, 1);
  will-change: transform;
  pointer-events: auto;
}

.photo-stage.is-grabbing img {
  transition: none !important;
}

/* Floating Toolbar over Photo */
.photo-floating-toolbar {
  position: absolute;
  top: 12px;
  right: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(14, 14, 18, 0.72);
  backdrop-filter: blur(12px);
  padding: 5px 8px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  z-index: 10;
}

.photo-tool-btn {
  background: transparent;
  border: none;
  color: #f0f0f4;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s ease, transform 0.15s ease, color 0.2s ease;
}

.photo-tool-btn:hover {
  background: rgba(255, 255, 255, 0.22);
  color: #ffffff;
  transform: scale(1.08);
}

.photo-tool-btn svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* Floating Zoom Indicator Chip */
.photo-zoom-chip {
  position: absolute;
  bottom: 12px;
  left: 12px;
  background: rgba(14, 14, 18, 0.75);
  backdrop-filter: blur(8px);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.04em;
  padding: 5px 12px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.25s ease;
  z-index: 10;
}

.photo-zoom-chip.is-visible {
  opacity: 1;
}

/* Floating Hint */
.photo-hint {
  position: absolute;
  bottom: 12px;
  right: 12px;
  font-size: 11px;
  color: rgba(255, 255, 255, 0.7);
  background: rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(6px);
  padding: 4px 10px;
  border-radius: 999px;
  pointer-events: none;
}

@media (max-width: 640px) {
  .photo-hint {
    display: none;
  }
}

/* ================= DEDICATED FULLSCREEN LIGHTBOX ================= */
.fullview-lightbox {
  position: fixed;
  inset: 0;
  background: rgba(6, 5, 9, 0.96);
  backdrop-filter: blur(18px);
  z-index: 2500;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
  padding: 16px;
  user-select: none;
  touch-action: none;
}

.fullview-lightbox.open {
  opacity: 1;
  pointer-events: auto;
}

.lightbox-stage {
  width: 100%;
  height: calc(100vh - 110px);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
  cursor: zoom-in;
}

.lightbox-stage.is-zoomed {
  cursor: grab;
}

.lightbox-stage.is-grabbing {
  cursor: grabbing;
}

.lightbox-stage img {
  max-width: 94vw;
  max-height: 84vh;
  object-fit: contain;
  border-radius: 8px;
  transform-origin: center center;
  transition: transform 0.18s cubic-bezier(0.2, 0, 0.2, 1);
  will-change: transform;
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
}

.lightbox-stage.is-grabbing img {
  transition: none !important;
}

.lightbox-close {
  position: absolute;
  top: 18px;
  right: 20px;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #fff;
  font-size: 30px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 2600;
  transition: background 0.2s ease, transform 0.15s ease;
}

.lightbox-close:hover {
  background: rgba(200, 16, 46, 0.85);
  transform: scale(1.08);
}

.lightbox-toolbar {
  position: absolute;
  bottom: 22px;
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(22, 20, 28, 0.84);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.18);
  padding: 8px 16px;
  border-radius: 999px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  z-index: 2600;
}

.lightbox-btn {
  background: transparent;
  border: none;
  color: #fff;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s ease, transform 0.15s ease;
}

.lightbox-btn:hover {
  background: rgba(255, 255, 255, 0.2);
  transform: scale(1.1);
}

.lightbox-btn svg {
  width: 19px;
  height: 19px;
  stroke: currentColor;
  stroke-width: 2.2;
  fill: none;
}

.lightbox-zoom-val {
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  min-width: 48px;
  text-align: center;
  letter-spacing: 0.03em;
}

.lightbox-caption {
  position: absolute;
  top: 22px;
  left: 24px;
  color: #fff;
  font-size: 17px;
  font-weight: 700;
  max-width: 60%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
  z-index: 2600;
}

#modalBody h3 {
  font-size: 24px;
  margin-bottom: 20px;
}

.post-actions {
  margin-top: 20px;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  border-top: 1px solid var(--border-color);
  padding-top: 20px;
}

.action-button {
  border: 1px solid var(--button-border);
  background: var(--button-bg);
  color: var(--text-primary);
  min-width: 52px;
  height: 52px;
  padding: 0 16px;
  border-radius: 999px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
}

.action-button:hover {
  background: var(--button-hover-bg);
  transform: translateY(-1px);
}

.action-button:disabled {
  cursor: not-allowed;
  opacity: 0.7;
}

.action-button.is-active {
  background: rgba(200, 16, 46, 0.12);
  border-color: rgba(200, 16, 46, 0.36);
  color: var(--primary-red);
}

.action-icon {
  width: 21px;
  height: 21px;
  display: inline-flex;
}

.action-icon svg {
  width: 100%;
  height: 100%;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.action-button.is-active .action-icon svg.fill-on-active {
  fill: currentColor;
}

.action-count {
  font-weight: 700;
  font-size: 14px;
  color: inherit;
}

.action-label {
  font-size: 14px;
  font-weight: 600;
  color: inherit;
  white-space: nowrap;
}

/* ================= HEART POP & SAVE MICRO-INTERACTIONS ================= */
.action-button,
.comment-like-btn {
  position: relative;
}

/* Elastic Spring Pop on the Heart Icon */
.action-button.animate-pop .action-icon,
.comment-like-btn.animate-pop .action-icon {
  animation: heartSpringPop 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}

/* Particle / Halo Burst Ring Behind Heart */
.action-button.animate-pop::after,
.comment-like-btn.animate-pop::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 26px;
  width: 22px;
  height: 22px;
  margin-top: -11px;
  margin-left: -11px;
  border-radius: 50%;
  border: 2px solid var(--primary-red);
  pointer-events: none;
  animation: heartHaloBurst 0.55s ease-out forwards;
}

.comment-like-btn.animate-pop::after {
  left: 8px;
  width: 16px;
  height: 16px;
  margin-top: -8px;
  margin-left: -8px;
}

/* Bookmark Notch Drop Animation */
.action-button.animate-save .action-icon {
  animation: bookmarkSpringDrop 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}

.action-button.animate-save::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  width: 22px;
  height: 22px;
  margin-top: -11px;
  margin-left: -11px;
  border-radius: 50%;
  border: 2px solid #d97706;
  pointer-events: none;
  animation: heartHaloBurst 0.55s ease-out forwards;
}

@keyframes heartSpringPop {
  0% {
    transform: scale(1);
  }
  25% {
    transform: scale(0.68);
  }
  50% {
    transform: scale(1.42);
    filter: drop-shadow(0 0 8px rgba(200, 16, 46, 0.5));
  }
  75% {
    transform: scale(0.92);
  }
  100% {
    transform: scale(1);
  }
}

@keyframes heartHaloBurst {
  0% {
    transform: scale(0.4);
    opacity: 0.95;
  }
  60% {
    opacity: 0.7;
    border-width: 2px;
  }
  100% {
    transform: scale(2.4);
    opacity: 0;
    border-width: 0.5px;
  }
}

@keyframes bookmarkSpringDrop {
  0% {
    transform: translateY(0) scale(1);
  }
  25% {
    transform: translateY(-4px) scale(0.82);
  }
  50% {
    transform: translateY(3px) scale(1.36);
    filter: drop-shadow(0 0 8px rgba(217, 119, 6, 0.5));
  }
  75% {
    transform: translateY(-1px) scale(0.96);
  }
  100% {
    transform: translateY(0) scale(1);
  }
}

@media (prefers-reduced-motion: reduce) {
  .action-button.animate-pop .action-icon,
  .comment-like-btn.animate-pop .action-icon,
  .action-button.animate-save .action-icon {
    animation: none !important;
  }
  .action-button.animate-pop::after,
  .comment-like-btn.animate-pop::after,
  .action-button.animate-save::after {
    display: none !important;
  }
}

/* ================= GALLERY MODAL NAV & SLIDE TRANSITIONS ================= */
.modal-nav-btn {
  position: absolute;
  top: 310px;
  transform: translateY(-50%);
  width: 44px;
  height: 44px;

.photo-header-meta {

.photo-index-pill {

<script>
const LOCAL_BACKEND_ORIGIN = "http://localhost:3000";

function getBackendOrigin() {
  if (window.CYABackendOrigin?.resolveBackendOrigin) {
    return window.CYABackendOrigin.resolveBackendOrigin({ localFallback: LOCAL_BACKEND_ORIGIN });
  }

  const { protocol, hostname, port, origin } = window.location;
  const isLocalHost = hostname === "localhost" || hostname === "127.0.0.1";
  if (protocol.startsWith("http") && (!isLocalHost || port === "3000")) {
    return origin;
  }

  return LOCAL_BACKEND_ORIGIN;
}

const backendOrigin = getBackendOrigin();

function buildBackendUrl(path) {
  if (window.CYABackendOrigin?.buildBackendUrl) {
    return window.CYABackendOrigin.buildBackendUrl(path, backendOrigin);
  }

  return new URL(path, backendOrigin).toString();
}

let currentUser = null;

async function loadAuthState() {
  try {
    const response = await fetch(buildBackendUrl("/api/auth/user"), {
      credentials: "include"
    });

    if (!response.ok) {
      return null;
    }

    const user = await response.json();
    return (user && user.displayName) ? user : null;
  } catch (error) {
    console.error("Could not load auth state:", error);
    return null;
  }
}

let allGalleryItems = [];
let currentGalleryIndex = -1;
let isNavigatingGallery = false;

async function loadGallery() {
  try {
    const response = await fetch(buildBackendUrl("/api/gallery"));
    const images = await response.json();
    allGalleryItems = Array.isArray(images) ? images : [];

    const container = document.getElementById("galleryContainer");
    container.innerHTML = "";

    allGalleryItems.forEach(item => {
      const fileUrl = buildBackendUrl(item.image_url);
      const isVideo = item.image_url.match(/\.(mp4|webm|ogg|mov)$/i);
      
      let mediaMarkup = "";
      if (isVideo) {
        mediaMarkup = `<video src="${fileUrl}" style="width: 100%; height: 280px; object-fit: cover; pointer-events: none;"></video>`;
      } else {
        mediaMarkup = `<img src="${fileUrl}" alt="${item.title}">`;
      }

      const card = `
        <div class="gallery-item" data-id="${item.id}" data-aos="fade-up">
          ${mediaMarkup}
          <div class="gallery-title">${item.title}</div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (window.AOS) {
      AOS.refreshHard();
    }

    document.querySelectorAll('.gallery-item').forEach(item => {
      item.addEventListener('click', () => openGalleryModal(item.dataset.id));
    });

  } catch (error) {
    console.error("Error loading gallery:", error);
  }
}

const modal = document.getElementById('galleryModal');
const modalBody = document.getElementById('modalBody');
const modalClose = document.querySelector('.modal-close');
const modalPrevBtn = document.getElementById('modalPrevBtn');
const modalNextBtn = document.getElementById('modalNextBtn');

const fullViewLightbox = document.getElementById('fullViewLightbox');
const lightboxClose = document.getElementById('lightboxClose');
const lightboxStage = document.getElementById('lightboxStage');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxCaption = document.getElementById('lightboxCaption');
const lbZoomVal = document.getElementById('lbZoomVal');
const lbZoomIn = document.getElementById('lbZoomIn');
const lbZoomOut = document.getElementById('lbZoomOut');
const lbReset = document.getElementById('lbReset');
const lbPrevBtn = document.getElementById('lbPrevBtn');
const lbNextBtn = document.getElementById('lbNextBtn');

let lightboxController = null;

function findGalleryIndex(itemId) {
  if (!allGalleryItems || allGalleryItems.length === 0) return -1;
  return allGalleryItems.findIndex(item => String(item.id) === String(itemId));
}

function updateNavControls() {
  const hasItems = allGalleryItems && allGalleryItems.length > 1;
  const hasPrev = currentGalleryIndex > 0;
  const hasNext = currentGalleryIndex >= 0 && currentGalleryIndex < allGalleryItems.length - 1;

  if (modalPrevBtn && modalNextBtn) {
    if (!hasItems) {
      modalPrevBtn.style.display = 'none';
      modalNextBtn.style.display = 'none';
    } else {
      modalPrevBtn.style.display = 'inline-flex';
      modalNextBtn.style.display = 'inline-flex';
      modalPrevBtn.disabled = !hasPrev;
      modalNextBtn.disabled = !hasNext;
    }
  }

  if (lbPrevBtn && lbNextBtn) {
    if (!hasItems) {
      lbPrevBtn.style.display = 'none';
      lbNextBtn.style.display = 'none';
    } else {
      lbPrevBtn.style.display = 'inline-flex';
      lbNextBtn.style.display = 'inline-flex';
      lbPrevBtn.disabled = !hasPrev;
      lbNextBtn.disabled = !hasNext;
    }
  }
}

async function navigateGallery(direction) {
  if (!allGalleryItems || allGalleryItems.length <= 1 || isNavigatingGallery) return;

  let targetIndex = currentGalleryIndex;
  if (direction === 'next') {
    if (targetIndex < allGalleryItems.length - 1) {
      targetIndex++;
    } else {
      return;
    }
  } else if (direction === 'prev') {
    if (targetIndex > 0) {
      targetIndex--;
    } else {
      return;
    }
  } else {
    return;
  }

  const targetItem = allGalleryItems[targetIndex];
  if (!targetItem) return;

  await openGalleryModal(targetItem.id, direction);
}

function attachZoomPanController(stageEl, imgEl, chipEl) {
  if (!stageEl || !imgEl) return null;

  let scale = 1;
  let translateX = 0;
  let translateY = 0;
  let isDragging = false;
  let startX = 0;
  let startY = 0;
  let initialTx = 0;
  let initialTy = 0;
  let hideChipTimer = null;

  function showChip(val) {
    if (!chipEl) return;
    chipEl.textContent = `${Math.round(val * 100)}%`;
    if (chipEl.classList) {
      chipEl.classList.add('is-visible');
      clearTimeout(hideChipTimer);
      hideChipTimer = setTimeout(() => {
        chipEl.classList.remove('is-visible');
      }, 1200);
    }
  }

  function applyTransform(animate = true) {
    if (!animate) {
      stageEl.classList.add('is-grabbing');
    } else {
      stageEl.classList.remove('is-grabbing');
    }

    imgEl.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    stageEl.classList.toggle('is-zoomed', scale > 1.05);
    showChip(scale);
  }

  function clampPan() {
    if (scale <= 1) {
      translateX = 0;
      translateY = 0;
      return;
    }
    const stageRect = stageEl.getBoundingClientRect();
    const maxPanX = Math.max(0, (stageRect.width * (scale - 1)) / 2 + 60);
    const maxPanY = Math.max(0, (stageRect.height * (scale - 1)) / 2 + 60);

    translateX = Math.max(-maxPanX, Math.min(maxPanX, translateX));
    translateY = Math.max(-maxPanY, Math.min(maxPanY, translateY));
  }

  function setZoom(newScale) {
    const clamped = Math.max(1, Math.min(4, newScale));
    if (clamped <= 1) {
      scale = 1;
      translateX = 0;
      translateY = 0;
    } else {
      scale = clamped;
      clampPan();
    }
    applyTransform(true);
  }

  function zoomIn() {
    setZoom(scale + 0.5);
  }

  function zoomOut() {
    setZoom(scale - 0.5);
  }

  function resetZoom() {
    setZoom(1);
  }

  function toggleZoom() {
    if (scale > 1.05) {
      resetZoom();
    } else {
      setZoom(2.2);
    }
  }

  stageEl.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = e.deltaY < 0 ? 0.35 : -0.35;
    setZoom(scale + delta);
  }, { passive: false });

  stageEl.addEventListener('dblclick', (e) => {
    e.preventDefault();
    toggleZoom();
  });

  stageEl.addEventListener('mousedown', (e) => {
    if (scale <= 1) return;
    isDragging = true;
    startX = e.clientX;
    startY = e.clientY;
    initialTx = translateX;
    initialTy = translateY;
    stageEl.classList.add('is-grabbing');
  });

  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    translateX = initialTx + dx;
    translateY = initialTy + dy;
    clampPan();
    applyTransform(false);
  });

  window.addEventListener('mouseup', () => {
    if (isDragging) {
      isDragging = false;
      stageEl.classList.remove('is-grabbing');
    }
  });

  let initialTouchDist = 0;
  let initialTouchScale = 1;

  stageEl.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      initialTouchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      initialTouchScale = scale;
    } else if (e.touches.length === 1 && scale > 1) {
      isDragging = true;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      initialTx = translateX;
      initialTy = translateY;
      stageEl.classList.add('is-grabbing');
    }
  }, { passive: true });

  stageEl.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && initialTouchDist > 0) {
      e.preventDefault();
      const currentDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      const factor = currentDist / initialTouchDist;
      setZoom(initialTouchScale * factor);
    } else if (e.touches.length === 1 && isDragging) {
      e.preventDefault();
      const dx = e.touches[0].clientX - startX;
      const dy = e.touches[0].clientY - startY;
      translateX = initialTx + dx;
      translateY = initialTy + dy;
      clampPan();
      applyTransform(false);
    }
  }, { passive: false });

  stageEl.addEventListener('touchend', () => {
    isDragging = false;
    stageEl.classList.remove('is-grabbing');
    initialTouchDist = 0;
  });

  return {
    zoomIn,
    zoomOut,
    resetZoom,
    toggleZoom,
    getScale: () => scale
  };
}

function openFullViewLightbox(imageUrl, title) {
  if (!fullViewLightbox || !lightboxImg) return;
  lightboxImg.src = imageUrl;
  if (lightboxCaption) {
    const countText = allGalleryItems.length > 1 && currentGalleryIndex >= 0
      ? ` (${currentGalleryIndex + 1} of ${allGalleryItems.length})`
      : '';
    lightboxCaption.textContent = `${title || ''}${countText}`;
  }
  fullViewLightbox.classList.add('open');
  fullViewLightbox.setAttribute('aria-hidden', 'false');

  if (lightboxController) {
    lightboxController.resetZoom();
  }

  lightboxController = attachZoomPanController(lightboxStage, lightboxImg, {
    set textContent(text) {
      if (lbZoomVal) lbZoomVal.textContent = text;
    },
    classList: { add: () => {}, remove: () => {} }
  });

  updateNavControls();
}

function closeFullViewLightbox() {
  if (!fullViewLightbox) return;
  fullViewLightbox.classList.remove('open');
  fullViewLightbox.setAttribute('aria-hidden', 'true');
  if (lightboxController) {
    lightboxController.resetZoom();
  }
}

if (lightboxClose) {
  lightboxClose.addEventListener('click', closeFullViewLightbox);
}

if (fullViewLightbox) {
  fullViewLightbox.addEventListener('click', (e) => {
    if (e.target === fullViewLightbox || e.target === lightboxStage) {
      closeFullViewLightbox();
    }
  });
}

if (lbZoomIn) lbZoomIn.addEventListener('click', () => lightboxController?.zoomIn());
if (lbZoomOut) lbZoomOut.addEventListener('click', () => lightboxController?.zoomOut());
if (lbReset) lbReset.addEventListener('click', () => lightboxController?.resetZoom());

if (modalPrevBtn) modalPrevBtn.addEventListener('click', (e) => { e.stopPropagation(); navigateGallery('prev'); });
if (modalNextBtn) modalNextBtn.addEventListener('click', (e) => { e.stopPropagation(); navigateGallery('next'); });
if (lbPrevBtn) lbPrevBtn.addEventListener('click', (e) => { e.stopPropagation(); navigateGallery('prev'); });
if (lbNextBtn) lbNextBtn.addEventListener('click', (e) => { e.stopPropagation(); navigateGallery('next'); });

let lbTouchStartX = 0;
let lbTouchStartY = 0;
let lbTouchStartTime = 0;

if (lightboxStage) {
  lightboxStage.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      lbTouchStartX = e.touches[0].clientX;
      lbTouchStartY = e.touches[0].clientY;
      lbTouchStartTime = Date.now();
    }
  }, { passive: true });

  lightboxStage.addEventListener('touchend', (e) => {
    if (e.changedTouches.length === 1) {
      if (lightboxController && lightboxController.getScale() > 1.05) return;
      const deltaX = e.changedTouches[0].clientX - lbTouchStartX;
      const deltaY = e.changedTouches[0].clientY - lbTouchStartY;
      const duration = Date.now() - lbTouchStartTime;
      if (duration < 600 && Math.abs(deltaX) >= 50 && Math.abs(deltaX) > Math.abs(deltaY) * 1.4) {
        if (deltaX < 0) {
          navigateGallery('next');
        } else {
          navigateGallery('prev');
        }
      }
    }
  }, { passive: true });
}

modalClose.addEventListener('click', closeGalleryModal);
modal.addEventListener('click', (e) => {
  if (e.target === modal) {
    closeGalleryModal();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (fullViewLightbox && fullViewLightbox.classList.contains('open')) {
      closeFullViewLightbox();
      return;
    }
    if (modal.classList.contains('open')) {
      closeGalleryModal();
    }
    return;
  }

  // Keyboard navigation for gallery photos
  if (modal.classList.contains('open') || (fullViewLightbox && fullViewLightbox.classList.contains('open'))) {
    const activeEl = document.activeElement;
    const tagName = activeEl ? activeEl.tagName.toLowerCase() : '';
    if (tagName === 'input' || tagName === 'textarea' || activeEl?.isContentEditable) {
      return;
    }

    if (e.key === 'ArrowRight') {
      e.preventDefault();
      navigateGallery('next');
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      navigateGallery('prev');
    }
  }
});

function closeGalleryModal() {
  closeFullViewLightbox();
  modal.classList.remove('open');
  modalBody.innerHTML = '';
  const currentUrl = new URL(window.location.href);
  if (currentUrl.searchParams.has('item')) {
    currentUrl.searchParams.delete('item');
    window.history.replaceState({}, '', `${currentUrl.pathname}${currentUrl.search}${currentUrl.hash}`);
  }
}

function escapeHtml(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

async function openGalleryModal(itemId, direction = null) {
  currentGalleryIndex = findGalleryIndex(itemId);
  updateNavControls();

  const isModalAlreadyOpen = modal.classList.contains('open');

  if (!isModalAlreadyOpen) {
    modalBody.innerHTML = `
      <div class="church-loader modal-loader">
        <div class="emblem-wrapper">
          <div class="emblem-halo"></div>
          <img src="favicon.png" alt="AIC Ziwani" class="loader-emblem">
        </div>
        <span class="loader-message">Opening gallery moment...</span>
      </div>
    `;
    modal.classList.add('open');
  } else if (direction) {
    isNavigatingGallery = true;
    const existingMedia = modalBody.querySelector('.media-container');
    if (existingMedia) {
      existingMedia.classList.remove('slide-in-right', 'slide-in-left');
      existingMedia.classList.add(direction === 'next' ? 'slide-out-left' : 'slide-out-right');
      await new Promise(r => setTimeout(r, 130));
    }
  }

  try {
    const response = await fetch(buildBackendUrl(`/api/gallery/${itemId}`), {
      credentials: 'include'
    });
    if (!response.ok) throw new Error('Failed to load gallery item.');
    const item = await response.json();

    if (!modal.classList.contains('open')) return;

    currentGalleryIndex = findGalleryIndex(item.id);
    updateNavControls();

    const fileUrl = buildBackendUrl(item.image_url);
    const isVideo = item.image_url.match(/\.(mp4|webm|ogg|mov)$/i);
    const slideClass = direction === 'next' ? 'slide-in-right' : direction === 'prev' ? 'slide-in-left' : '';

    const mediaMarkup = isVideo
      ? `<video src="${fileUrl}" controls></video>`
      : `
        <div class="interactive-photo-box" id="modalPhotoBox">
          <div class="photo-stage" id="modalPhotoStage">
            <img src="${fileUrl}" alt="${escapeHtml(item.title)}" id="modalPhotoImg" draggable="false">
          </div>
          <div class="photo-floating-toolbar">
            <button type="button" class="photo-tool-btn" id="photoZoomInBtn" title="Zoom In (+)" aria-label="Zoom In">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
            </button>
            <button type="button" class="photo-tool-btn" id="photoZoomOutBtn" title="Zoom Out (-)" aria-label="Zoom Out">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
            </button>
            <button type="button" class="photo-tool-btn" id="photoResetBtn" title="Reset Zoom" aria-label="Reset Zoom">
              <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
            </button>
            <button type="button" class="photo-tool-btn" id="photoExpandBtn" title="Full Screen View" aria-label="Full Screen View">
              <svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path></svg>
            </button>
          </div>
          <div class="photo-zoom-chip" id="modalZoomChip">100%</div>
          <div class="photo-hint">Double-click or scroll to zoom &bull; Drag to pan</div>
        </div>
      `;

    const counterPill = allGalleryItems.length > 1 && currentGalleryIndex >= 0
      ? `<div class="photo-header-meta"><span class="photo-index-pill">Photo ${currentGalleryIndex + 1} of ${allGalleryItems.length}</span></div>`
      : '';

    modalBody.innerHTML = `
      <div class="media-container ${slideClass}">${mediaMarkup}</div>
      ${counterPill}
      <h3>${escapeHtml(item.title)}</h3>
      <div class="post-actions">
        ${getActionButtonsMarkup(item.likes)}
      </div>
      <div class="comments-section">
        <h4><span id="commentCount">${item.comments.length}</span> Comments</h4>
        <form id="commentForm">
          <input type="text" id="authorName" placeholder="Your Name" required>
          <textarea id="commentContent" placeholder="Write a comment..." required></textarea>
          <button type="submit">Post Comment</button>
        </form>
        <div id="commentsList"></div>
      </div>
    `;

    renderGalleryComments(item.comments, item.id);

    if (!isVideo) {
      const modalStage = document.getElementById('modalPhotoStage');
      const modalImg = document.getElementById('modalPhotoImg');
      const modalChip = document.getElementById('modalZoomChip');
      const photoController = attachZoomPanController(modalStage, modalImg, modalChip);

      document.getElementById('photoZoomInBtn')?.addEventListener('click', () => photoController?.zoomIn());
      document.getElementById('photoZoomOutBtn')?.addEventListener('click', () => photoController?.zoomOut());
      document.getElementById('photoResetBtn')?.addEventListener('click', () => photoController?.resetZoom());
      document.getElementById('photoExpandBtn')?.addEventListener('click', () => openFullViewLightbox(fileUrl, item.title));

      let photoTouchStartX = 0;
      let photoTouchStartY = 0;
      let photoTouchStartTime = 0;

      modalStage?.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          photoTouchStartX = e.touches[0].clientX;
          photoTouchStartY = e.touches[0].clientY;
          photoTouchStartTime = Date.now();
        }
      }, { passive: true });

      modalStage?.addEventListener('touchend', (e) => {
        if (e.changedTouches.length === 1) {
          if (photoController && photoController.getScale() > 1.05) return;
          const deltaX = e.changedTouches[0].clientX - photoTouchStartX;
          const deltaY = e.changedTouches[0].clientY - photoTouchStartY;
          const duration = Date.now() - photoTouchStartTime;
          if (duration < 600 && Math.abs(deltaX) >= 50 && Math.abs(deltaX) > Math.abs(deltaY) * 1.4) {
            if (deltaX < 0) {
              navigateGallery('next');
            } else {
              navigateGallery('prev');
            }
          }
        }
      }, { passive: true });
    }

    if (fullViewLightbox && fullViewLightbox.classList.contains('open')) {
      lightboxImg.src = fileUrl;
      if (lightboxCaption) {
        const countText = allGalleryItems.length > 1 && currentGalleryIndex >= 0
          ? ` (${currentGalleryIndex + 1} of ${allGalleryItems.length})`
          : '';
        lightboxCaption.textContent = `${item.title || ''}${countText}`;
      }
      if (lightboxController) {
        lightboxController.resetZoom();
      }
    }

    const saveButton = document.getElementById('saveButton');
    const likeButton = document.getElementById('likeButton');
    const commentForm = document.getElementById('commentForm');
    const authorNameInput = document.getElementById('authorName');
    const nextUrl = new URL(window.location.href);
    nextUrl.searchParams.set('item', String(item.id));
    window.history.replaceState({}, '', `${nextUrl.pathname}${nextUrl.search}${nextUrl.hash}`);

    if (!currentUser) {
      saveButton.disabled = true;
      likeButton.disabled = true;
      saveButton.title = 'Login to save';
      likeButton.title = 'Login to like';

      if (commentForm) {
        const loginPrompt = document.createElement('p');
        loginPrompt.textContent = 'Please log in from the home page to save, like, or comment on this item.';
        commentForm.replaceWith(loginPrompt);
      }
    } else {
      if (authorNameInput) {
        authorNameInput.value = currentUser.displayName || '';
        authorNameInput.readOnly = true;
      }

      setGallerySaveButtonState(saveButton, item.userHasSaved);
      saveButton.addEventListener('click', () => handleGallerySaveToggle(item.id));
      setGalleryLikeButtonState(likeButton, item.userHasLiked, item.likes);
      likeButton.addEventListener('click', () => handleGalleryLikeToggle(item.id));

      if (commentForm) {
        commentForm.addEventListener('submit', (e) => handleGalleryCommentSubmit(e, item.id));
      }
    }

  } catch (error) {
    modalBody.innerHTML = `<p style="color: red;">${error.message}</p>`;
  } finally {
    isNavigatingGallery = false;
  }
}

function setGallerySaveButtonState(button, isSaved) {
  if (!button) return;
  button.dataset.saved = isSaved ? 'true' : 'false';
  button.classList.toggle('is-active', isSaved);
  button.title = isSaved ? 'Remove saved item' : 'Save this item';
  button.setAttribute('aria-label', button.title);
}

function setGalleryLikeButtonState(button, isLiked, likeCount) {
  if (!button) return;
  button.dataset.liked = isLiked ? 'true' : 'false';
  button.classList.toggle('is-active', isLiked);
  button.title = isLiked ? 'Unlike this item' : 'Like this item';
  button.setAttribute('aria-label', button.title);

  const count = button.querySelector('#likeCount');
  if (count) {
    count.textContent = String(likeCount);
  }
}

function buildCommentGroups(comments) {
  const groups = new Map();

  comments.forEach((comment) => {
    const key = comment.parent_comment_id ?? 0;
    if (!groups.has(key)) {
      groups.set(key, []);
    }
    groups.get(key).push(comment);
  });

  return groups;
}

function createGalleryReplyForm(itemId, parentCommentId) {
  const form = document.createElement('form');
  form.className = 'reply-form';
  form.innerHTML = `
    <textarea placeholder="Write a reply..." required></textarea>
    <div class="reply-form-actions">
      <button class="reply-submit-btn" type="submit">Reply</button>
      <button class="reply-cancel-btn" type="button">Cancel</button>
    </div>
  `;

  form.addEventListener('submit', (event) => handleGalleryCommentSubmit(event, itemId, parentCommentId));
  form.querySelector('.reply-cancel-btn').addEventListener('click', () => {
    form.classList.add('reply-form-closing');
    setTimeout(() => form.remove(), 160);
  });

  return form;
}

function setGalleryCommentLikeButtonState(button, isLiked, likeCount) {
  if (!button) return;
  button.dataset.liked = isLiked ? 'true' : 'false';
  button.classList.toggle('is-active', isLiked);
  button.title = isLiked ? 'Unlike comment' : 'Like comment';
  button.setAttribute('aria-label', button.title);

  const count = button.querySelector('.comment-like-count');
  if (count) {
    count.textContent = String(likeCount);
  }
}

async function handleGalleryCommentLikeToggle(commentId, button) {
  if (!button) return;

  const isLiked = button.dataset.liked === 'true';
  button.disabled = true;

  try {
    const response = await fetch(buildBackendUrl(`/api/gallery-comments/${commentId}/like`), {
      method: isLiked ? 'DELETE' : 'POST',
      credentials: 'include'
    });
    const result = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(result.error || 'Failed to like comment.');
    }

    setGalleryCommentLikeButtonState(button, Boolean(result.liked), typeof result.likes === 'number' ? result.likes : 0);
    if (result.liked) {
      button.classList.remove('animate-pop');
      void button.offsetWidth;
      button.classList.add('animate-pop');
    }
  } catch (error) {
    alert(error.message);
  } finally {
    button.disabled = !currentUser;
  }
}

function createGalleryCommentElement(comment, commentGroups, itemId, depth = 0) {
  const commentDate = new Date(comment.created_at).toLocaleString('en-US', {
    year: 'numeric',
    month: 'short',
    day: 'numeric',
    hour: '2-digit',
    minute: '2-digit'
  });
  const commentEl = document.createElement('article');
  commentEl.className = `comment${depth ? ' is-reply' : ''}`;

  const header = document.createElement('div');
  header.className = 'comment-header';
  header.innerHTML = `
    <div class="comment-author-group">
      ${getCommentAvatarMarkup(comment)}
      <div class="comment-meta-block">
        <div class="comment-meta-topline">
          <span class="comment-author">${escapeHtml(comment.author_name)}</span>
          ${comment.authorIsAdmin ? '<span class="comment-role-badge">Admin</span>' : ''}
        </div>
        <div class="comment-meta">
          <span class="comment-date">${escapeHtml(commentDate)}</span>
        </div>
      </div>
    </div>
  `;

  const body = document.createElement('p');
  body.className = 'comment-content';
  body.textContent = comment.content;

  commentEl.appendChild(header);
  commentEl.appendChild(body);

  const toolbar = document.createElement('div');
  toolbar.className = 'comment-toolbar';

  const likeButton = document.createElement('button');
  likeButton.type = 'button';
  likeButton.className = 'comment-like-btn';
  likeButton.innerHTML = `
    <span class="action-icon">${getHeartIconMarkup()}</span>
    <span class="comment-like-count">${comment.likes || 0}</span>
  `;
  setGalleryCommentLikeButtonState(likeButton, comment.userHasLiked, comment.likes || 0);
  likeButton.disabled = !currentUser;
  if (!currentUser) {
    likeButton.title = 'Login to like comments';
    likeButton.setAttribute('aria-label', likeButton.title);
  }
  likeButton.addEventListener('click', () => handleGalleryCommentLikeToggle(comment.id, likeButton));
  toolbar.appendChild(likeButton);

  if (currentUser) {
    const replyButton = document.createElement('button');
    replyButton.type = 'button';
    replyButton.className = 'reply-toggle-btn';
    replyButton.textContent = 'Reply';
    replyButton.addEventListener('click', () => {
      const existingForm = commentEl.querySelector('.reply-form');
      if (existingForm) {
        existingForm.classList.add('reply-form-closing');
        setTimeout(() => existingForm.remove(), 160);
        return;
      }

      toolbar.after(createGalleryReplyForm(itemId, comment.id));
    });

    toolbar.appendChild(replyButton);
  }

  commentEl.appendChild(toolbar);

  const childComments = commentGroups.get(comment.id) || [];
  if (childComments.length) {
    const childrenHost = document.createElement('div');
    childrenHost.className = 'comment-children';
    const visibleChildren = childComments.slice(0, 2);
    const hiddenChildren = childComments.slice(2);

    visibleChildren.forEach((child) => {
      childrenHost.appendChild(createGalleryCommentElement(child, commentGroups, itemId, depth + 1));
    });

    if (hiddenChildren.length) {
      const hiddenRepliesHost = document.createElement('div');
      hiddenRepliesHost.className = 'comment-hidden-children';

      const innerWrapper = document.createElement('div');
      innerWrapper.className = 'comment-hidden-children-inner';

      hiddenChildren.forEach((child) => {
        innerWrapper.appendChild(createGalleryCommentElement(child, commentGroups, itemId, depth + 1));
      });
      hiddenRepliesHost.appendChild(innerWrapper);

      const countText = `${hiddenChildren.length} more repl${hiddenChildren.length === 1 ? 'y' : 'ies'}`;
      const collapseButton = document.createElement('button');
      collapseButton.type = 'button';
      collapseButton.className = 'reply-collapse-btn';
      collapseButton.setAttribute('aria-expanded', 'false');
      collapseButton.innerHTML = `
        <span class="collapse-icon">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </span>
        <span class="collapse-text">View ${countText}</span>
      `;

      collapseButton.addEventListener('click', () => {
        const isCurrentlyExpanded = hiddenRepliesHost.classList.contains('is-expanded');
        if (isCurrentlyExpanded) {
          hiddenRepliesHost.classList.remove('is-expanded');
          collapseButton.classList.remove('is-expanded');
          collapseButton.setAttribute('aria-expanded', 'false');
          collapseButton.querySelector('.collapse-text').textContent = `View ${countText}`;
        } else {
          hiddenRepliesHost.classList.add('is-expanded');
          collapseButton.classList.add('is-expanded');
          collapseButton.setAttribute('aria-expanded', 'true');
          collapseButton.querySelector('.collapse-text').textContent = 'Hide extra replies';
        }
      });

      childrenHost.appendChild(collapseButton);
      childrenHost.appendChild(hiddenRepliesHost);
    }

    commentEl.appendChild(childrenHost);
  }

  return commentEl;
}

function renderGalleryComments(comments, itemId) {
  const commentsList = document.getElementById('commentsList');
  commentsList.innerHTML = '';

  if (comments.length === 0) {
    commentsList.innerHTML = '<p>No comments yet. Be the first to comment!</p>';
    return;
  }

  const commentGroups = buildCommentGroups(comments);
  const rootComments = commentGroups.get(0) || [];

  rootComments.forEach((comment) => {
    commentsList.appendChild(createGalleryCommentElement(comment, commentGroups, itemId));
  });
}

async function handleGalleryLikeToggle(itemId) {
  const likeButton = document.getElementById('likeButton');
  if (!likeButton) return;

  const isLiked = likeButton.dataset.liked === 'true';
  likeButton.disabled = true;

  try {
    const response = await fetch(buildBackendUrl(`/api/gallery/${itemId}/like`), {
      method: isLiked ? 'DELETE' : 'POST',
      credentials: 'include'
    });
    const result = await response.json().catch(() => ({}));
    if (!response.ok) {
      throw new Error(result.error || 'Failed to like item.');
    }

    setGalleryLikeButtonState(likeButton, Boolean(result.liked), typeof result.likes === 'number' ? result.likes : 0);
    if (result.liked) {
      likeButton.classList.remove('animate-pop');
      void likeButton.offsetWidth;
      likeButton.classList.add('animate-pop');
    }
  } catch (error) {
    alert(error.message);
  }

  likeButton.disabled = false;
}

async function handleGallerySaveToggle(itemId) {
  const saveButton = document.getElementById('saveButton');
  if (!saveButton) return;

  const isSaved = saveButton.dataset.saved === 'true';
  saveButton.disabled = true;

  try {
    const response = await fetch(buildBackendUrl(`/api/gallery/${itemId}/save`), {
      method: isSaved ? 'DELETE' : 'POST',
      credentials: 'include'
    });
    const result = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(result.error || 'Failed to update saved item.');
    }

    setGallerySaveButtonState(saveButton, Boolean(result.saved));
    if (result.saved) {
      saveButton.classList.remove('animate-save');
      void saveButton.offsetWidth;
      saveButton.classList.add('animate-save');
    }
  } catch (error) {
    alert(error.message);
    setGallerySaveButtonState(saveButton, isSaved);
  } finally {
    saveButton.disabled = false;
  }
}

async function handleGalleryCommentSubmit(event, itemId, parentCommentId = null) {
  event.preventDefault();
  const form = event.target;
  const textarea = form.querySelector('textarea');
  const content = textarea?.value || '';
  const submitButton = form.querySelector('button[type="submit"]');
  const isReply = parentCommentId !== null;
  const originalButtonText = submitButton.textContent;

  submitButton.disabled = true;
  submitButton.textContent = isReply ? 'Replying...' : 'Posting...';

  try {
    const response = await fetch(buildBackendUrl(`/api/gallery/${itemId}/comments`), {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content, parentCommentId }),
    });
    const newComment = await response.json();
    if (!response.ok) throw new Error(newComment.error || 'Failed to post comment.');

    await openGalleryModal(itemId);
  } catch (error) {
    alert(error.message);
  } finally {
    submitButton.disabled = false;
    submitButton.textContent = originalButtonText;
  }
}

(async () => {
  currentUser = await loadAuthState();
  await loadGallery();
  const requestedItemId = new URLSearchParams(window.location.search).get('item');
  if (requestedItemId) {
    await openGalleryModal(requestedItemId);
  }
})();
